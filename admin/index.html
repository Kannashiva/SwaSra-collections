<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SwaSra Admin Login
    </title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <h1>
                SwaSra Collections
            </h1>

            <p>
                Admin Login
            </p>

            <form id="adminLoginForm">

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                >
                    Login
                </button>

            </form>

            <p
                id="loginMessage"
            ></p>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="/supabase-config.js"></script>

    <script
        src="/admin/admin.js"
    ></script>

</body>

</html>
